<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- SEO primario -->
    <title>Casa Moli | Casa Turística en Barbate, Cádiz</title>

    <link rel="canonical" href="https://casamoli.es" />

    <!-- Open Graph (previsualización al compartir) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://casamoli.es" />
    <meta property="og:title" content="Casa Moli | Casa Turística en Barbate, Cádiz" />

    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Casa Moli" />

    <!-- Datos estructurados (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LodgingBusiness",
      "name": "Casa Moli",
      "description": "Casa turística en el corazón de Barbate. Vivienda costera andaluza restaurada con patio privado, 2 habitaciones y capacidad para 4 personas. A 5 minutos de la playa.",
      "url": "https://casamoli.es",
      "telephone": "+34696742513",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Barbate",
        "addressRegion": "Cádiz",
        "addressCountry": "ES"
      },
      "amenityFeature": [
        { "@type": "LocationFeatureSpecification", "name": "Patio privado", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "WiFi", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Ducha exterior", "value": true }
      ],
      "logo": {
        "@type": "ImageObject",
        "url": "https://casamoli.es/img/logoarc.png"
      },
      "image": "https://casamoli.es/img/bghero.png",
      "numberOfRooms": 2,
      "occupancy": { "@type": "QuantitativeValue", "maxValue": 4 },
      "sameAs": ["https://www.airbnb.com/rooms/990479684820183934"]
    }
    </script>

    <link rel="icon" type="image/png" href="/img/logoarc.png" />
    <link rel="shortcut icon" href="/img/logoarc.png" />
    <link rel="apple-touch-icon" href="/img/logoarc.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  </head>
